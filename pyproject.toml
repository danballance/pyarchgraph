[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyarchgraph"
version = "0.1.0"
description = "Evidence-first static Python import dependency analyser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyarchgraph contributors" }]
dependencies = [
  "networkx>=3.6,<4",
]

[project.scripts]
pyarchgraph = "pyarchgraph.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyarchgraph"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**/*.py" = ["F401"]
